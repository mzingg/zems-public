name: Deploy GitHub Pages

# Serves the project website (zems.dev) from this public repo. The site is a next.js static export authored in the
# upstream monorepo under 50_frontend/site_zems_public and lands here as source via promote; this workflow builds
# the export and deploys it to GitHub Pages. The site renders the repo markdown (README.md, docs/, and the README.md
# and docs/ of every library whose POM is marked public), so a change to any of those paths redeploys it. Every
# promote stamps the release version into the library setup pages, so every release redeploys the site with the
# version it shipped with.
on:
  push:
    branches: ['main']
    paths:
      - '50_frontend/site_zems_public/**'
      - 'README.md'
      - 'docs/**'
      - '10_lib/*/README.md'
      - '10_lib/*/docs/**'
      - '10_lib/*/pom.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; do not cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Keep in step with the monorepo dev shell (pkgs.nodejs_24 in flake.nix).
          node-version: 24
          cache: npm
          cache-dependency-path: 50_frontend/site_zems_public/package-lock.json

      - name: Build the static export
        working-directory: 50_frontend/site_zems_public
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 50_frontend/site_zems_public/target/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
